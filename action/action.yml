name: 'skill-tools check'
description: 'Validate, lint, and score SKILL.md files'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  path:
    description: 'Path to SKILL.md files or directories'
    required: false
    default: '.'
  min-score:
    description: 'Minimum quality score (0-100)'
    required: false
    default: '0'
  fail-on:
    description: 'Severity threshold to fail: error, warning, or info'
    required: false
    default: 'error'
  version:
    description: 'skill-tools version to use'
    required: false
    default: '0.2.2'

runs:
  using: 'composite'
  steps:
    - name: Check SKILL.md files
      shell: bash
      env:
        SKILL_TOOLS_VERSION: ${{ inputs.version }}
        SKILL_TOOLS_PATH: ${{ inputs.path }}
        SKILL_TOOLS_FAIL_ON: ${{ inputs.fail-on }}
        SKILL_TOOLS_MIN_SCORE: ${{ inputs.min-score }}
      run: |
        npx "skill-tools@${SKILL_TOOLS_VERSION}" check \
          "${SKILL_TOOLS_PATH}" \
          --format text \
          --fail-on "${SKILL_TOOLS_FAIL_ON}" \
          --min-score "${SKILL_TOOLS_MIN_SCORE}"
